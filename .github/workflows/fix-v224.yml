name: Fix v2.2.4 accounting parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v224.yml'
      - '.github/scripts/fix_v224.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply patch
        run: python3 .github/scripts/fix_v224.py
      - name: Verify Rust
        shell: bash
        run: |
          cargo fmt --all -- --check || cargo fmt --all
          cargo test --workspace --all-targets
      - name: Verify dashboard
        shell: bash
        run: |
          cd web-ui
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run typecheck
          npm run build
      - name: Commit verified fix and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-v224.yml .github/scripts/fix_v224.py
          git config user.name 'Atingaii'
          git config user.email 'zyaiting@email.swu.edu.cn'
          git add -A
          git commit -m 'fix: close accounting parity gaps'
          git push origin HEAD:main

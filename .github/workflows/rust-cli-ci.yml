name: Rust CLI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-matrix:
    name: CLI / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: usagemesh
          - label: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: usagemesh
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: usagemesh.exe
          - label: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: usagemesh.exe
          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: usagemesh
          - label: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            binary: usagemesh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install and configure musl toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ '${{ matrix.target }}' = 'x86_64-unknown-linux-musl' ]; then
            echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
            echo 'CC_x86_64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
          else
            echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
            echo 'CC_aarch64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
          fi
      - name: Platform evidence
        run: rustc -vV
      - name: Validate Unix installer syntax
        if: runner.os != 'Windows'
        shell: bash
        run: sh -n install.sh
      - name: Validate PowerShell 7 installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Validate Windows PowerShell 5.1 installer syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Unit tests
        run: cargo test --workspace --all-targets --target ${{ matrix.target }}
      - name: Release build smoke test
        run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Verify Linux binary is static musl
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary='target/${{ matrix.target }}/release/${{ matrix.binary }}'
          file "$binary"
          if readelf -l "$binary" | grep -q 'Requesting program interpreter'; then
            echo 'Expected a static musl binary, but ELF requests a dynamic interpreter.' >&2
            exit 1
          fi
          if strings "$binary" | grep -q 'GLIBC_[0-9]'; then
            echo 'Static Linux artifact still contains a glibc symbol-version dependency.' >&2
            exit 1
          fi
          "$binary" --version
          "$binary" clients >/dev/null
      - name: CLI surface smoke test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          binary='target/${{ matrix.target }}/release/${{ matrix.binary }}'
          "$binary" --version
          "$binary" clients >/dev/null
      - name: CLI surface smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = 'target/${{ matrix.target }}/release/${{ matrix.binary }}'
          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw 'version smoke test failed' }
          & $binary clients | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'clients smoke test failed' }

  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Security and request-metadata invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ACCESS_PBKDF2_ITERATIONS: u32 = 600_000' rust-cli/src/crypto.rs
          grep -q 'legacy_310k_access_manifest_keeps_original_password' rust-cli/src/crypto.rs
          grep -q 'reasoning_effort_for_message' rust-cli/src/collector.rs
          grep -q 'thinkingbudget' rust-cli/src/evidence.rs
      - run: cargo clippy --workspace --all-targets

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Validate materialized dashboard invariants
        working-directory: web-ui
        shell: bash
        run: |
          set -euo pipefail
          test -s src/app.tsx
          test -s public/usagemesh-icon.svg
          test -s public/device-index.json
          grep -q "subscriptionSpeedMultiplier" src/app.tsx
          grep -q "分析工作台" src/app.tsx
          grep -q "实时请求明细" src/app.tsx
          grep -q "envelope.iterations < 100_000" src/app.tsx
          grep -q "Content-Security-Policy" index.html
          ! grep -q "REMEMBERED_WORKSPACE_KEY_PREFIX" src/app.tsx
          ! grep -q "sessionStorage" src/app.tsx
          grep -q "const DEVICE_INDEX_BRANCH = 'um-index'" src/app.tsx
          ! grep -q "FAST_SUBSCRIPTION_MULTIPLIER" src/app.tsx
      - name: Install dashboard dependencies
        working-directory: web-ui
        run: npm install --no-audit --no-fund
      - name: Typecheck and production build
        working-directory: web-ui
        run: |
          npm run typecheck
          npm run build

  upstream-parser-suite:
    name: Tokscale v4.14.0 parser regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: junhoyeo/tokscale
          ref: v4.14.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Run all tokscale-core parser/scanner tests
        run: cargo test -p tokscale-core --all-targets

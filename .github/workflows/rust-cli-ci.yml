name: Rust CLI CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-matrix:
    name: CLI / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: usagemesh
          - label: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: usagemesh
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: usagemesh.exe
          - label: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: usagemesh.exe
          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: usagemesh
          - label: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            binary: usagemesh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install and configure musl toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ '${{ matrix.target }}' = 'x86_64-unknown-linux-musl' ]; then
            echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
            echo 'CC_x86_64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
          else
            echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
            echo 'CC_aarch64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
          fi
      - name: Platform evidence
        run: rustc -vV
      - name: Validate Unix installer syntax
        if: runner.os != 'Windows'
        shell: bash
        run: sh -n install.sh
      - name: Validate PowerShell 7 installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Validate Windows PowerShell 5.1 installer syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Unit tests
        run: cargo test --workspace --all-targets --target ${{ matrix.target }}
      - name: Release build smoke test
        run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Verify Linux binary is static musl
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary='target/${{ matrix.target }}/release/${{ matrix.binary }}'
          file "$binary"
          if readelf -l "$binary" | grep -q 'Requesting program interpreter'; then
            echo 'Expected a static musl binary, but ELF requests a dynamic interpreter.' >&2
            exit 1
          fi
          if strings "$binary" | grep -q 'GLIBC_[0-9]'; then
            echo 'Static Linux artifact still contains a glibc symbol-version dependency.' >&2
            exit 1
          fi
          "$binary" --version
          "$binary" clients >/dev/null
      - name: CLI surface smoke test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          binary='target/${{ matrix.target }}/release/${{ matrix.binary }}'
          "$binary" --version
          "$binary" clients >/dev/null
      - name: CLI surface smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = 'target/${{ matrix.target }}/release/${{ matrix.binary }}'
          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw 'version smoke test failed' }
          & $binary clients | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'clients smoke test failed' }

  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check web/github-api-shim.js
          node --check web/analytics.js
          node --check web/app.js
      - name: Analytics unit tests
        run: node web/analytics.test.cjs
      - name: Privacy regression checks
        run: |
          ! grep -R -i -E 'auth\.json|prompt[^a-z]|assistant response|api[_ -]?key' web/*.js || (echo 'Dashboard code must not depend on private session payloads' && exit 1)

  upstream-parser-suite:
    name: Tokscale v4.14.0 parser regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: junhoyeo/tokscale
          ref: v4.14.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Run all tokscale-core parser/scanner tests
        run: cargo test -p tokscale-core --all-targets

name: Temporary presence dashboard patch

on:
  push:
    branches: [feat/resident-agent-presence]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[presence-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/resident-agent-presence
      - name: Apply deterministic source patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('web-ui/src/app.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "const DEVICE_INDEX_BRANCH = 'um-index';\nconst ACCESS_AAD_PREFIX",
                  "const DEVICE_INDEX_BRANCH = 'um-index';\nconst PRESENCE_BRANCH_PREFIX = 'um-presence-';\nconst ACCESS_AAD_PREFIX",
              ),
              (
                  "interface LedgerEnvelope {\n  schemaVersion: number;\n  kind: string;\n  deviceHash: string;\n  updatedAt: string;\n  algorithm: string;\n  nonce: string;\n  ciphertext: string;\n}\n\ninterface LedgerRow",
                  "interface LedgerEnvelope {\n  schemaVersion: number;\n  kind: string;\n  deviceHash: string;\n  updatedAt: string;\n  algorithm: string;\n  nonce: string;\n  ciphertext: string;\n}\n\ninterface DevicePresence {\n  schemaVersion: number;\n  kind: string;\n  deviceHash: string;\n  updatedAt: string;\n  appVersion?: string;\n}\n\ninterface LedgerRow",
              ),
              (
                  "interface Ledger {\n  schemaVersion?: number;\n  generatedAt?: string;",
                  "interface Ledger {\n  schemaVersion?: number;\n  generatedAt?: string;\n  presenceUpdatedAt?: string;",
              ),
              (
                  "    return JSON.parse(new TextDecoder().decode(plaintext)) as Ledger;\n  } catch {\n    throw new Error(`设备账本解密失败 (${branch})`);\n  }",
                  "    const ledger = JSON.parse(new TextDecoder().decode(plaintext)) as Ledger;\n    try {\n      const presence = await json<DevicePresence>(`${RAW}/${repo}/${PRESENCE_BRANCH_PREFIX}${envelope.deviceHash}/presence.json`);\n      if (\n        presence.kind === 'usagemesh-device-presence' &&\n        presence.schemaVersion === 1 &&\n        presence.deviceHash === envelope.deviceHash\n      ) {\n        ledger.presenceUpdatedAt = String(presence.updatedAt || '');\n      }\n    } catch {\n      // Backward compatibility: pre-resident-agent devices have no presence branch.\n    }\n    return ledger;\n  } catch {\n    throw new Error(`设备账本解密失败 (${branch})`);\n  }",
              ),
              (
                  "function rawDeviceIdentity(ledger: Ledger): { id: string; name: string; platform: string; arch: string; updatedAt: string } {\n  const id = String(ledger.device?.id || ledger.device?.name || 'unknown-device');\n  return {\n    id,\n    name: String(ledger.device?.name || ledger.device?.id || 'Unknown Device'),\n    platform: String(ledger.device?.platform || 'unknown'),\n    arch: String(ledger.device?.arch || ''),\n    updatedAt: String(ledger.generatedAt || ''),\n  };\n}",
                  "function rawDeviceIdentity(ledger: Ledger): { id: string; name: string; platform: string; arch: string; updatedAt: string; presenceAt: string } {\n  const id = String(ledger.device?.id || ledger.device?.name || 'unknown-device');\n  return {\n    id,\n    name: String(ledger.device?.name || ledger.device?.id || 'Unknown Device'),\n    platform: String(ledger.device?.platform || 'unknown'),\n    arch: String(ledger.device?.arch || ''),\n    updatedAt: String(ledger.generatedAt || ''),\n    presenceAt: String(ledger.presenceUpdatedAt || ''),\n  };\n}",
              ),
              (
                  "  if (age <= 2 * 60_000) return 'online';",
                  "  if (age <= 3 * 60_000) return 'online';",
              ),
              (
                  "      status: deviceSyncStatus(identity.updatedAt),",
                  "      status: deviceSyncStatus(identity.presenceAt || identity.updatedAt),",
              ),
              (
                  "<span className=\"w-1.5 h-1.5 rounded-full bg-amber-500\" />最近同步</span>",
                  "<span className=\"w-1.5 h-1.5 rounded-full bg-amber-500\" />心跳延迟</span>",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Commit dashboard integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-ui/src/app.tsx
          git diff --cached --check
          git commit -m 'feat: drive device status from presence heartbeats [presence-patched]'
          git push origin HEAD:feat/resident-agent-presence

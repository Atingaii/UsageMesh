name: Finalize Primary Dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-primary-site.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.repository == 'Atingaii/UsageMesh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove demo mode and use GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('web-ui/src/app.tsx')
          app = app_path.read_text()
          replacements = [
              ("function isBundledDemoRepo(repo: string): boolean {\n  return repo.toLowerCase() === DEFAULT_REPO.toLowerCase();\n}\n\n", ""),
              ("  const accessUrl = isBundledDemoRepo(repo)\n    ? new URL('demo/access.json', document.baseURI).toString()\n    : `${RAW}/${repo}/${ACCESS_BRANCH}/access.json`;\n  const envelope = await json<AccessEnvelope>(accessUrl);",
               "  const envelope = await json<AccessEnvelope>(`${RAW}/${repo}/${ACCESS_BRANCH}/access.json`);"),
              ("    ...(isBundledDemoRepo(repo) ? [new URL('demo/index.json', document.baseURI).toString()] : []),\n", ""),
              ("  const ledgerUrl = isBundledDemoRepo(repo)\n    ? new URL(`demo/${branch}.json`, document.baseURI).toString()\n    : `${RAW}/${repo}/${branch}/ledger.json`;\n  const envelope = await json<LedgerEnvelope>(ledgerUrl);",
               "  const envelope = await json<LedgerEnvelope>(`${RAW}/${repo}/${branch}/ledger.json`);")
          ]
          for old, new in replacements:
              if old not in app:
                  raise SystemExit(f'expected dashboard snippet not found: {old[:80]!r}')
              app = app.replace(old, new, 1)
          if 'demo/' in app or 'isBundledDemoRepo' in app:
              raise SystemExit('demo routing still present in dashboard source')
          app_path.write_text(app)

          for name, lang in [('README.md', 'en'), ('README.zh-CN.md', 'zh')]:
              p = Path(name)
              text = p.read_text()
              if lang == 'en':
                  text, n = re.subn(r"\n> \*\*Live demo:\*\* `https://atingaii\.github\.io/UsageMesh/` · password: `usagemesh-demo`  \n> The demo workspace contains synthetic sample data only\. It contains no real user, device, or session data\.\n", "\n> **Primary dashboard:** `https://atingaii.github.io/UsageMesh/`  \n> UsageMesh ships with **no default dashboard password**. The workspace owner creates the password locally during `usagemesh setup`.\n", text, count=1)
              else:
                  text, n = re.subn(r"\n> \*\*在线演示：\*\* `https://atingaii\.github\.io/UsageMesh/` · 密码：`usagemesh-demo`  \n> 演示工作区只包含人工生成的合成样例数据，不包含任何真实用户、设备或会话数据。\n", "\n> **主 Dashboard：** `https://atingaii.github.io/UsageMesh/`  \n> UsageMesh **不预置 Dashboard 密码**。工作区所有者在首次执行 `usagemesh setup` 时于本机自行创建密码。\n", text, count=1)
              if n != 1:
                  raise SystemExit(f'demo README block not found in {name}')
              p.write_text(text)

          sh = Path('install.sh')
          text = sh.read_text()
          old = 'DEFAULT_DISTRIBUTION_BASE="https://raw.githubusercontent.com/$REPO/distribution/latest"\nDEFAULT_RELEASE_BASE="https://github.com/$REPO/releases/latest/download"\nBASE="${USAGEMESH_RELEASE_BASE:-$DEFAULT_DISTRIBUTION_BASE}"'
          new = 'DEFAULT_RELEASE_BASE="https://github.com/$REPO/releases/latest/download"\nBASE="${USAGEMESH_RELEASE_BASE:-$DEFAULT_RELEASE_BASE}"'
          if old not in text:
              raise SystemExit('install.sh release-base block not found')
          text = text.replace(old, new, 1)
          text, n = re.subn(
              r'download_release_file\(\) \{.*?\n\}\n\ndownload_release_file "\$ASSET"',
              '''download_release_file() {\n  name="$1"\n  output="$2"\n\n  if download_direct "$BASE/$name" "$output"; then\n    return 0\n  fi\n\n  if [ -z "${USAGEMESH_RELEASE_BASE:-}" ] && download_with_gh "$name" "$output"; then\n    return 0\n  fi\n\n  echo "Failed to download $name from GitHub Releases." >&2\n  echo "Check access to github.com or authenticate once with 'gh auth login', then retry." >&2\n  exit 1\n}\n\ndownload_release_file "$ASSET"''',
              text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('install.sh download function not found')
          sh.write_text(text)

          ps = Path('install.ps1')
          text = ps.read_text()
          old = '$DefaultDistributionBase = "https://raw.githubusercontent.com/$Repo/distribution/latest"\n$DefaultReleaseBase = "https://github.com/$Repo/releases/latest/download"\n$Base = if ($env:USAGEMESH_RELEASE_BASE) { $env:USAGEMESH_RELEASE_BASE.TrimEnd(\'/\') } else { $DefaultDistributionBase }'
          new = '$DefaultReleaseBase = "https://github.com/$Repo/releases/latest/download"\n$Base = if ($env:USAGEMESH_RELEASE_BASE) { $env:USAGEMESH_RELEASE_BASE.TrimEnd(\'/\') } else { $DefaultReleaseBase }'
          if old not in text:
              raise SystemExit('install.ps1 release-base block not found')
          text = text.replace(old, new, 1)
          text, n = re.subn(
              r'function Download-ReleaseFile\(\[string\]\$Name, \[string\]\$OutFile\) \{.*?\n\}\n\ntry \{',
              '''function Download-ReleaseFile([string]$Name, [string]$OutFile) {\n  try {\n    Download-Direct "$Base/$Name" $OutFile\n    return\n  } catch {\n    if ($env:USAGEMESH_RELEASE_BASE) {\n      throw "Failed to download $Name from $Base. $($_.Exception.Message)"\n    }\n  }\n\n  if (Download-WithGitHubCli $Name $OutFile) { return }\n  throw "Failed to download $Name from GitHub Releases. Check access to github.com or run 'gh auth login' once, then retry."\n}\n\ntry {''',
              text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('install.ps1 download function not found')
          ps.write_text(text)
          PY
          rm -rf web-ui/public/demo

      - name: Validate production source
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n "usagemesh-demo" README.md README.zh-CN.md web-ui/src web-ui/public; then exit 1; fi
          if grep -R -n "isBundledDemoRepo\|demo/access.json\|demo/index.json" web-ui/src/app.tsx; then exit 1; fi
          if grep -R -n "distribution/latest" install.sh install.ps1; then exit 1; fi
          sh -n install.sh
          cd web-ui
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Commit production source and delete extra branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'UsageMesh Maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add -A README.md README.zh-CN.md install.sh install.ps1 web-ui
          git commit -m 'chore: make UsageMesh the primary password-owned dashboard'
          git push origin HEAD:main
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/distribution" >/dev/null 2>&1 || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/__noop_should_not_use" >/dev/null 2>&1 || true

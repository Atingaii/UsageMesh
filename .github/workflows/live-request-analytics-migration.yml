name: Live Request Analytics Migration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-live-request-analytics.py'
      - '.github/workflows/live-request-analytics-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.repository == 'Atingaii/UsageMesh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply migration
        run: python3 scripts/apply-live-request-analytics.py
      - name: Rust format and tests
        run: |
          cargo fmt --all
          cargo test --workspace
      - name: Dashboard typecheck and build
        working-directory: web-ui
        run: |
          npm install
          npm run typecheck
          npm run build
      - name: Commit migrated sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'UsageMesh Maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add rust-cli/src/model.rs rust-cli/src/codex_tier.rs rust-cli/src/collector.rs rust-cli/src/config.rs rust-cli/src/scheduler.rs rust-cli/src/main.rs rust-cli/Cargo.toml Cargo.lock web-ui/src/app.tsx web-ui/package.json README.md README.zh-CN.md
          git diff --cached --check
          git commit -m 'feat: add near-real-time request analytics'
          git push origin HEAD:main

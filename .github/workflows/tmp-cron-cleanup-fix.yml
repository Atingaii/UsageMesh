name: Temporary cron cleanup fix

on:
  push:
    branches: [feat/resident-agent-presence]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[cron-cleanup-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/resident-agent-presence
      - name: Preserve resident cron watchdog during legacy cleanup
        shell: python
        run: |
          from pathlib import Path
          path = Path('rust-cli/src/scheduler.rs')
          text = path.read_text(encoding='utf-8')
          anchor = '#[cfg(target_os = "linux")]\nfn install_cron() -> Result<String> {\n    let runner = write_unix_runner()?;\n    rewrite_crontab(true, Some(&runner))?;\n    let _ = Command::new(&runner).arg("--ensure").output();\n    Ok("cron-supervised resident sync agent (boot start + one-minute watchdog)".to_string())\n}\n'
          helper = '#[cfg(target_os = "linux")]\nfn remove_legacy_cron_entries() -> Result<()> {\n    if Command::new("crontab").arg("-l").output().is_err() {\n        return Ok(());\n    }\n    let existing = Command::new("crontab")\n        .arg("-l")\n        .output()\n        .ok()\n        .filter(|output| output.status.success())\n        .map(|output| String::from_utf8_lossy(&output.stdout).to_string())\n        .unwrap_or_default();\n    if existing.is_empty() || !existing.contains("# usagemesh-usage-sync") {\n        return Ok(());\n    }\n    let cleaned = existing\n        .lines()\n        .filter(|line| !line.contains("# usagemesh-usage-sync"))\n        .collect::<Vec<_>>()\n        .join("\\n");\n    let mut child = Command::new("crontab")\n        .arg("-")\n        .stdin(std::process::Stdio::piped())\n        .spawn()\n        .context("failed to start crontab")?;\n    use std::io::Write;\n    child\n        .stdin\n        .as_mut()\n        .context("crontab stdin unavailable")?\n        .write_all(format!("{cleaned}\\n").as_bytes())?;\n    if !child.wait()?.success() {\n        bail!("crontab legacy cleanup failed");\n    }\n    Ok(())\n}\n\n'
          if text.count(anchor) != 1:
              raise SystemExit('install_cron anchor mismatch')
          text = text.replace(anchor, helper + anchor, 1)
          old = '    let _ = rewrite_crontab(true, None);\n}\n\n#[cfg(target_os = "linux")]\nfn uninstall_linux()'
          new = '    // Preserve the new cron resident-agent watchdog when systemd is unavailable;\n    // only the pre-v2.5 two-entry sync schedule is legacy here.\n    let _ = remove_legacy_cron_entries();\n}\n\n#[cfg(target_os = "linux")]\nfn uninstall_linux()'
          if text.count(old) != 1:
              raise SystemExit('cleanup_legacy_linux anchor mismatch')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust-cli/src/scheduler.rs
          git diff --cached --check
          git commit -m 'fix: preserve cron resident watchdog after migration [cron-cleanup-fixed]'
          git push origin HEAD:feat/resident-agent-presence

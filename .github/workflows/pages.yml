name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'web-ui/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest dashboard source
        shell: bash
        run: |
          set -euo pipefail
          upstream='Atingaii/UsageMesh'
          if [ "$GITHUB_REPOSITORY" = "$upstream" ]; then
            source_sha="$GITHUB_SHA"
          else
            rm -rf /tmp/usagemesh-upstream
            git clone --depth 1 --filter=blob:none --sparse "https://github.com/${upstream}.git" /tmp/usagemesh-upstream
            git -C /tmp/usagemesh-upstream sparse-checkout set web-ui
            source_sha="$(git -C /tmp/usagemesh-upstream rev-parse HEAD)"
            rm -rf web-ui
            cp -a /tmp/usagemesh-upstream/web-ui ./web-ui
          fi
          echo "USAGEMESH_DASHBOARD_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "Dashboard source: ${upstream}@${source_sha}"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Validate dashboard security policy
        working-directory: web-ui
        shell: bash
        run: |
          set -euo pipefail
          test -s public/usagemesh-icon.svg
          test -s public/device-index.json
          grep -q "Content-Security-Policy" index.html
          grep -q "no-referrer" index.html
          ! grep -q "fonts.googleapis.com" src/index.css

      - name: Install dashboard dependencies
        working-directory: web-ui
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build
        working-directory: web-ui
        run: |
          npm run typecheck
          npm test
          npm run format:check
          npm run build

      - name: Write deployment provenance
        shell: bash
        run: |
          cat > web-ui/dist/build-info.json <<EOF
          {
            "workspaceRepository": "${GITHUB_REPOSITORY}",
            "dashboardSource": "Atingaii/UsageMesh",
            "dashboardSourceSha": "${USAGEMESH_DASHBOARD_SOURCE_SHA}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Refresh live device index when available
        shell: bash
        run: |
          live_index="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/um-index/index.json"
          if curl -fsSL --retry 2 "$live_index" -o /tmp/device-index.json; then
            cp /tmp/device-index.json web-ui/dist/device-index.json
            echo "Using live um-index as the deployed fallback."
          fi
          test -s web-ui/dist/device-index.json
          test -s web-ui/dist/usagemesh-icon.svg

      - name: Ensure GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null 2>&1 || true
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "::error::Enable Pages in Settings > Pages > Source: GitHub Actions, then rerun this workflow."
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-ui/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Normalize Cargo Lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-cargo-lock.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: github.repository == 'Atingaii/UsageMesh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh workspace lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo check --workspace
          git config user.name 'UsageMesh Maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo 'Cargo.lock already current.'
            exit 0
          fi
          git commit -m 'chore: refresh Cargo.lock for v2.0.2'
          git push origin HEAD:main

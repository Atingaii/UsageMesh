    const activity = () => {
      const now = Date.now();
      if (now - lastTouch < 15_000) return;
      lastTouch = now;
      touchDashboardSession();
    };
    const events: Array<keyof WindowEventMap> = ['pointerdown', 'keydown', 'focus'];
    for (const event of events) window.addEventListener(event, activity, { passive: true });

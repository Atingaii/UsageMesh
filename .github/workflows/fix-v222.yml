      if (!dashboardSessionExpired()) return;
      setDataset(null);
      setWorkspaceKeyValue('');
      setUnlockError(null);
      void forgetDashboardSession();
    }, 30_000);
    return () => {
      for (const event of events) window.removeEventListener(event, activity);
      window.clearInterval(timer);
    };
  }, [workspaceKeyValue]);
'''
          anchor = "  }, [workspaceKeyValue]);\n\n  const unlock = async (nextPassword: string) => {"
          text = replace_once(text, anchor, "  }, [workspaceKeyValue]);\n" + activity_effect + "\n  const unlock = async (nextPassword: string) => {", 'session-activity-effect')

          text = replace_once(
              text,
              "      setDataset(next);\n      setWorkspaceKeyValue(key);\n      setSyncStatus('synced');",
              "      try { await rememberDashboardSession(repoFromLocation(), key); } catch { /* private mode may disable IndexedDB; login still works */ }\n      setDataset(next);\n      setWorkspaceKeyValue(key);\n      setSyncStatus('synced');",
              'remember-session-on-unlock',
          )
          text = replace_once(
              text,
              "    setWorkspaceKeyValue('');\n    setUnlockError(null);\n  };",
              "    setWorkspaceKeyValue('');\n    setUnlockError(null);\n    void forgetDashboardSession();\n  };",
              'forget-session-on-lock',
          )
          text = replace_once(
              text,
              "  if (!dataset) return <div className={isDarkMode ? 'dark' : ''}><UnlockScreen onUnlock={unlock} error={unlockError} /></div>;",
              "  if (!sessionRestoreDone) return <div className={isDarkMode ? 'dark' : ''}><div className=\"min-h-screen grid place-items-center bg-[var(--bg-main)] text-[var(--text-muted)] text-sm font-mono\"><div className=\"flex items-center gap-2\"><RefreshCw className=\"w-4 h-4 animate-spin\"/>正在恢复安全会话…</div></div></div>;\n  if (!dataset) return <div className={isDarkMode ? 'dark' : ''}><UnlockScreen onUnlock={unlock} error={unlockError} /></div>;",
              'restore-loading-screen',
          )
          text = text.replace('输入原来的 Dashboard 密码即可。密码只在当前页面参与 PBKDF2 + AES-GCM 解密；解密后的工作区密钥只保留在页面内存，刷新或关闭页面后需要重新输入密码。', '输入原来的 Dashboard 密码即可。密码只在当前页面参与 PBKDF2 + AES-GCM 解密且不会持久化。登录后会建立同一标签页的加密安全会话：普通刷新可自动恢复；闲置 30 分钟、会话超过 12 小时、手动锁定或关闭标签页后需要重新输入密码。')
          text = text.replace('使用设备设置的 Dashboard 密码即可从任意浏览器访问。', '同一标签页刷新无需重复输入；关闭标签页或安全会话过期后仍需使用原 Dashboard 密码。')

          # Device status must reflect actual last-sync age instead of always claiming online.
          status_helper = r'''
function deviceStatusBadge(status: DeviceInfo['status']) {
  if (status === 'online') return <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-600 font-semibold text-[10px]"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse" />在线</span>;
  if (status === 'syncing') return <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-600 font-semibold text-[10px]"><span className="w-1.5 h-1.5 rounded-full bg-amber-500" />最近同步</span>;
  if (status === 'error') return <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-red-500/10 text-red-600 font-semibold text-[10px]"><span className="w-1.5 h-1.5 rounded-full bg-red-500" />异常</span>;
  return <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-slate-500/10 text-slate-500 font-semibold text-[10px]"><span className="w-1.5 h-1.5 rounded-full bg-slate-400" />离线</span>;
}
'''
          if 'function deviceStatusBadge' not in text:
              text = replace_once(text, 'interface DevicesViewProps { devices: DeviceInfo[]; }', status_helper + '\ninterface DevicesViewProps { devices: DeviceInfo[]; }', 'device-status-helper')
          old_status = '<td className="px-4 py-3 text-center"><span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-600 font-semibold text-[10px]"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse" />在线已同步</span></td>'
          text = text.replace(old_status, '<td className="px-4 py-3 text-center">{deviceStatusBadge(dev.status)}</td>')

          # Accurate cost naming and policy: USD amount is API-equivalent, no speed multiplier.
          text = text.replace('订阅等价费用', '估算费用')
          text = text.replace('跨设备 AI Coding Token、路由来源与估算费用', '跨设备 AI Coding Token、路由来源与统一费用估算')
          text = text.replace("fastMultiplier: 2.5,", "fastMultiplier: 1.0,")
          text = text.replace('<span className="text-[var(--text-muted)]">Fast mode</span><span className="font-semibold text-[var(--accent-blue)]">{pricing.fastMultiplier.toFixed(1)}× Standard</span>', '<span className="text-[var(--text-muted)]">USD Tier multiplier</span><span className="font-semibold text-[var(--accent-blue)]">1.0×（速率不改变美元估算）</span>')
          text = text.replace('Fast / Priority 的订阅等价口径按 2.5× Standard 处理。', 'Fast / Priority 只作为速率/Tier 元数据保留，不再乘进美元费用；这样网站与设备端统一账本保持同一 API 等价计费口径。')
          text = text.replace('Fast / Priority 在本 Dashboard 的“订阅等价”口径中按 2.5× Standard 计算。', 'Fast / Priority 仅作为速率/Tier 元数据展示，不改变美元 API 等价费用。')
          p.write_text(text)

          # Pricing policy documentation.
          Path('docs/PRICING.md').write_text('''# Cost semantics\n\nUsageMesh reports an **estimated API-equivalent USD cost** so totals on the hosted Dashboard can be compared directly with the same device-side unified ledger. It is an estimate, not a provider invoice and not a guarantee of subscription quota accounting.\n\n## Source of truth\n\nToken parsing, cache buckets and request boundaries are resolved on the device before encryption. The device-side pricing adapter uses the public `models.dev` catalog for general models and guarded GPT-5.6 rates where the project needs a stable audited card. The hosted Dashboard does **not** re-price aggregated rows in the browser; it displays the cost already calculated on the device.\n\nFor GPT-5.6 Sol the guarded base card per 1M tokens is: fresh input **$5.00**, cache read **$0.50**, cache write **$6.25**, output/reasoning output **$30.00**.\n\n## Speed tier\n\n`Standard`, `Fast` and `Priority` are usage metadata. They are useful for understanding subscription speed/quota behavior, but UsageMesh does **not** multiply the USD estimate by 2.5× simply because a request is Fast/Priority. A speed/quota multiplier is a different metric from API-equivalent monetary cost and must not be mixed into the dollar total.\n\n## Long context and unknown prices\n\nLong-context rules are applied from request-level evidence where supported. When a model, route or cache-write bucket cannot be priced confidently, UsageMesh marks the estimate as a lower bound instead of inventing a precise value.\n''')

          # Security documentation: encrypted same-tab session resume.
          p = Path('SECURITY.md')
          sec = p.read_text()
          old = '''## Browser session\n\nThe dashboard never persists the plaintext password. After a successful unlock, the decrypted workspace key is kept only in the current page's JavaScript memory. It is **not** written to `localStorage`, `sessionStorage`, IndexedDB, the URL, cookies, or GitHub.\n\nRefreshing, closing, or recreating the page therefore requires the same dashboard password again. The manual **Lock** action also discards the in-memory key immediately.\n'''
          new = '''## Browser session\n\nThe dashboard never persists the plaintext password. After a successful unlock, UsageMesh creates a same-tab secure-resume envelope: the workspace key is encrypted with a fresh non-extractable AES-GCM `CryptoKey`; only the ciphertext, IV, repository identity, key identifier and timestamps are placed in `sessionStorage`, while the non-extractable wrapping key is stored through IndexedDB structured cloning. The plaintext workspace key is never written to `localStorage`, `sessionStorage`, IndexedDB, cookies, the URL or GitHub.\n\nThis allows an ordinary refresh in the same tab to restore the unlocked session without asking for the password again. The session automatically expires after 30 minutes of inactivity or 12 hours absolute lifetime. Manual **Lock** clears the session envelope and deletes the wrapping key. Closing the tab clears the `sessionStorage` handle, so a new tab requires the original dashboard password again.\n\nA non-extractable browser key is defense in depth, not an HttpOnly server session: JavaScript already executing in the trusted dashboard origin while it is unlocked can ask WebCrypto to use that key. The restrictive CSP and absence of third-party runtime scripts therefore remain part of the security boundary.\n'''

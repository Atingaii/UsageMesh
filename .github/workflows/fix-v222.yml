              r = r.replace('Dashboard 展示的是**用量估算 / 订阅等价估算**，不是供应商发票，也不声称等于某个订阅后台的实际扣减。', 'Dashboard 展示的是**API 等价美元费用估算**，不是供应商发票，也不把 Fast / Priority 的订阅额度倍率混入美元费用。')
              r = r.replace('subscription-equivalent estimate', 'API-equivalent cost estimate')

name: Temporary migration metadata fix

on:
  push:
    branches: [feat/resident-agent-presence]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[migration-metadata-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/resident-agent-presence
      - name: Ensure migration metadata reaches remote ledger
        shell: python
        run: |
          from pathlib import Path
          path = Path('rust-cli/src/main.rs')
          text = path.read_text(encoding='utf-8')
          old = '    if accounting_unchanged && !version_migration && !schema_migration {'
          new = '    if accounting_unchanged && !version_migration && !schema_migration && !pricing_migration {'
          if text.count(old) != 1:
              raise SystemExit('accounting unchanged migration guard mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust-cli/src/main.rs
          git diff --cached --check
          git commit -m 'fix: publish refreshed ledger metadata after migrations [migration-metadata-fixed]'
          git push origin HEAD:feat/resident-agent-presence

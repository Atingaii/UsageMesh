name: Fix v2.3.0 official pricing and route evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_v230.py'
      - '.github/workflows/fix-v230.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Apply patch
        run: python .github/scripts/fix_v230.py
      - name: Verify Rust
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Verify dashboard
        working-directory: web-ui
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Verify privacy and pricing invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'official-time-aware-api-estimate-v4' rust-cli/src/pricing.rs
          grep -q 'GPT56_SOL_PROMO_EFFECTIVE' rust-cli/src/pricing.rs
          grep -q 'route_hint_from_base_url' rust-cli/src/evidence.rs
          grep -q 'lookalike_domain_is_not_official' rust-cli/src/provider.rs
          grep -q 'raw URL remains local' rust-cli/src/provider.rs
          ! grep -R --line-number -E 'api\.openai\.com/v1.*(ledger|route_provider)' rust-cli/src web-ui/src || true
      - name: Commit verified fix and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Atingaii'
          git config user.email 'zyaiting@email.swu.edu.cn'
          git rm -f .github/scripts/fix_v230.py .github/workflows/fix-v230.yml
          git add -A
          git commit -m 'fix: use official time-aware pricing and local endpoint route evidence'
          git push origin HEAD:main

name: Set One Minute Cadence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/set-one-minute-cadence.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply migration
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/usagemesh-cadence.py
          python3 /tmp/usagemesh-cadence.py
          cargo fmt --all
          cargo test --workspace
          git config user.name 'UsageMesh Maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add rust-cli/src/main.rs rust-cli/src/config.rs rust-cli/src/scheduler.rs rust-cli/Cargo.toml Cargo.lock README.md README.zh-CN.md
          git diff --cached --check
          git commit -m 'feat: refresh UsageMesh every minute'
          git push origin HEAD:main

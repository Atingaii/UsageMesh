name: Materialize Clean Dashboard Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-clean-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'Atingaii/UsageMesh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-ui/package.json

      - name: Materialize the audited dashboard
        working-directory: web-ui
        shell: bash
        run: |
          set -euo pipefail
          python3 patch-pricing-policy.py
          python3 patch-session-persistence.py
          python3 patch-device-index.py
          python3 patch-analytics-workbench.py
          mkdir -p public
          cat > public/device-index.json <<'JSON'
          {
            "schemaVersion": 1,
            "kind": "usagemesh-device-index",
            "branches": [],
            "updatedAt": null
          }
          JSON
          rm -f patch-pricing-policy.py patch-session-persistence.py patch-device-index.py patch-analytics-workbench.py
          rm -f src/app.part.*

      - name: Remove predecessor web implementation
        shell: bash
        run: rm -rf web

      - name: Validate final source directly
        working-directory: web-ui
        shell: bash
        run: |
          set -euo pipefail
          grep -q "subscriptionSpeedMultiplier" src/app.tsx
          grep -q "分析工作台" src/app.tsx
          grep -q "设备 × 模型用量矩阵" src/app.tsx
          grep -q "sessionStorage" src/app.tsx
          grep -q "const DEVICE_INDEX_BRANCH = 'um-index'" src/app.tsx
          ! grep -q "FAST_SUBSCRIPTION_MULTIPLIER" src/app.tsx
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Commit clean materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'UsageMesh Maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add -A web-ui web
          git commit -m 'refactor: materialize clean UsageMesh dashboard source'
          git push origin HEAD:main

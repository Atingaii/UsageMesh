name: Release CLI

on:
  push:
    branches: [main]
    paths:
      - '.release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Release / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: usagemesh-linux-x86_64
            binary: usagemesh
          - label: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: usagemesh-linux-aarch64
            binary: usagemesh
          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            asset: usagemesh-macos-aarch64
            binary: usagemesh
          - label: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            asset: usagemesh-macos-x86_64
            binary: usagemesh
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: usagemesh-windows-x86_64
            binary: usagemesh.exe
          - label: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: usagemesh-windows-aarch64
            binary: usagemesh.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install and configure musl toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ '${{ matrix.target }}' = 'x86_64-unknown-linux-musl' ]; then
            echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
            echo 'CC_x86_64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
          else
            echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
            echo 'CC_aarch64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
          fi
      - name: Platform evidence
        run: rustc -vV
      - name: Test
        run: cargo test --workspace --all-targets --target ${{ matrix.target }}
      - name: Build release
        run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Verify Linux binary is libc-independent
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary='target/${{ matrix.target }}/release/usagemesh'
          file "$binary"
          if readelf -l "$binary" | grep -q 'Requesting program interpreter'; then
            echo 'Linux release is dynamically linked and may require a newer glibc.' >&2
            exit 1
          fi
          if strings "$binary" | grep -q 'GLIBC_[0-9]'; then
            echo 'Linux release still contains a glibc symbol-version dependency.' >&2
            exit 1
          fi
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p out/package
          cp 'target/${{ matrix.target }}/release/${{ matrix.binary }}' out/package/usagemesh
          chmod +x out/package/usagemesh
          tar -C out/package -czf 'out/${{ matrix.asset }}.tar.gz' usagemesh
          cd out
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum '${{ matrix.asset }}.tar.gz' > '${{ matrix.asset }}.sha256'
          else
            shasum -a 256 '${{ matrix.asset }}.tar.gz' > '${{ matrix.asset }}.sha256'
          fi
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/package | Out-Null
          Copy-Item 'target/${{ matrix.target }}/release/${{ matrix.binary }}' 'out/package/usagemesh.exe'
          Compress-Archive -Force 'out/package/usagemesh.exe' 'out/${{ matrix.asset }}.zip'
          $hash = (Get-FileHash 'out/${{ matrix.asset }}.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.asset }}.zip" | Set-Content -NoNewline 'out/${{ matrix.asset }}.sha256'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}.*
          if-no-files-found: error

  publish-candidate:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' rust-cli/Cargo.toml | head -n 1)"
          test -n "$version"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish verified-candidate assets as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --prerelease --title "$RELEASE_TAG"
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "$RELEASE_TAG" \
              --prerelease \
              --latest=false
          fi

  verify-install:
    name: Install smoke / ${{ matrix.label }}
    needs: publish-candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-latest
          - label: linux-arm64
            os: ubuntu-24.04-arm
          - label: macos-arm64
            os: macos-latest
          - label: macos-x64
            os: macos-15-intel
          - label: windows-x64
            os: windows-latest
          - label: windows-arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install from candidate GitHub Release (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          USAGEMESH_RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/${{ needs.publish-candidate.outputs.tag }}
          EXPECTED_TAG: ${{ needs.publish-candidate.outputs.tag }}
        run: |
          export USAGEMESH_INSTALL_DIR="$RUNNER_TEMP/usagemesh-bin"
          sh ./install.sh
          expected="${EXPECTED_TAG#v}"
          "$USAGEMESH_INSTALL_DIR/usagemesh" --version | grep -F "$expected"
          "$USAGEMESH_INSTALL_DIR/usagemesh" clients >/dev/null
      - name: Install from candidate GitHub Release (Windows PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          USAGEMESH_RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/${{ needs.publish-candidate.outputs.tag }}
          EXPECTED_TAG: ${{ needs.publish-candidate.outputs.tag }}
        run: |
          $env:USAGEMESH_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'usagemesh-bin-pwsh'
          ./install.ps1
          $binary = Join-Path $env:USAGEMESH_INSTALL_DIR 'usagemesh.exe'
          $version = & $binary --version
          $expected = $env:EXPECTED_TAG.TrimStart('v')
          if ($LASTEXITCODE -ne 0 -or $version -notmatch [regex]::Escape($expected)) { throw "Unexpected version: $version" }
          & $binary clients | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'clients smoke test failed' }
      - name: Install from candidate GitHub Release (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          USAGEMESH_RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/${{ needs.publish-candidate.outputs.tag }}
          EXPECTED_TAG: ${{ needs.publish-candidate.outputs.tag }}
        run: >-
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -Command
          "$env:USAGEMESH_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'usagemesh-bin-wps51';
          & './install.ps1';
          $binary = Join-Path $env:USAGEMESH_INSTALL_DIR 'usagemesh.exe';
          $version = & $binary --version;
          $expected = $env:EXPECTED_TAG.TrimStart('v');
          if ($LASTEXITCODE -ne 0 -or $version -notmatch [regex]::Escape($expected)) { throw ('Unexpected version: ' + $version) };
          & $binary clients | Out-Null;
          if ($LASTEXITCODE -ne 0) { throw 'clients smoke test failed' }"

  promote:
    name: Promote stable release
    needs: [publish-candidate, verify-install]
    runs-on: ubuntu-latest
    steps:
      - name: Mark candidate as stable latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.publish-candidate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease=false \
            --latest \
            --title "$RELEASE_TAG"

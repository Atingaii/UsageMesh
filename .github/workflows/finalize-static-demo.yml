      - name: Validate static demo and dashboard build
        working-directory: web-ui
        run: |
          grep -q "isBundledDemoRepo" src/app.tsx
          grep -q "demo/access.json" src/app.tsx
          grep -q "demo/index.json" src/app.tsx
          test -s public/demo/access.json
          test -s public/demo/index.json
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Commit final source and remove temporary demo branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'UsageMesh Maintenance'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/finalize-static-demo.yml
          git add -A
          git commit -m 'feat(web): bundle clean synthetic demo workspace'
          git push origin HEAD:main
          for branch in um-dashboard um-index um-ledger-42b488a492b9e07a um-ledger-1d186dc1f552b1b2 um-ledger-58cea26624967407; do
            git push origin --delete "$branch" || true
          done

name: Finalize Static Demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-static-demo.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.repository == 'Atingaii/UsageMesh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Bundle synthetic demo into the static site
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web-ui/src/app.tsx')
          s = p.read_text()

          anchor = "const REMEMBERED_WORKSPACE_KEY_PREFIX = 'usagemesh:remembered-workspace-key:v1:';\n"
          insert = anchor + "\nfunction isBundledDemoRepo(repo: string): boolean {\n  return repo.toLowerCase() === DEFAULT_REPO.toLowerCase();\n}\n"
          if 'function isBundledDemoRepo' not in s:
              if anchor not in s: raise SystemExit('demo helper anchor missing')
              s = s.replace(anchor, insert, 1)

          old = "  const envelope = await json<AccessEnvelope>(`${RAW}/${repo}/${ACCESS_BRANCH}/access.json`);"
          new = "  const accessUrl = isBundledDemoRepo(repo)\n    ? new URL('demo/access.json', document.baseURI).toString()\n    : `${RAW}/${repo}/${ACCESS_BRANCH}/access.json`;\n  const envelope = await json<AccessEnvelope>(accessUrl);"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('workspaceKey patch anchor missing')

          old = "  const urls = [\n    // The CLI updates this branch on every successful sync, so newly joined\n    // devices become visible immediately without rebuilding GitHub Pages.\n    `${RAW}/${repo}/${DEVICE_INDEX_BRANCH}/index.json`,"
          new = "  const urls = [\n    ...(isBundledDemoRepo(repo) ? [new URL('demo/index.json', document.baseURI).toString()] : []),\n    // The CLI updates this branch on every successful sync, so newly joined\n    // devices become visible immediately without rebuilding GitHub Pages.\n    `${RAW}/${repo}/${DEVICE_INDEX_BRANCH}/index.json`,"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('device index patch anchor missing')

          old = "  const envelope = await json<LedgerEnvelope>(`${RAW}/${repo}/${branch}/ledger.json`);"
          new = "  const ledgerUrl = isBundledDemoRepo(repo)\n    ? new URL(`demo/${branch}.json`, document.baseURI).toString()\n    : `${RAW}/${repo}/${branch}/ledger.json`;\n  const envelope = await json<LedgerEnvelope>(ledgerUrl);"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('ledger patch anchor missing')

          p.write_text(s)
          PY

          mkdir -p web-ui/public/demo
          cat > web-ui/public/demo/access.json <<'EOF'
          {"schemaVersion":1,"kind":"usagemesh-dashboard-access","kdf":"PBKDF2-HMAC-SHA256","iterations":310000,"salt":"S6_umHYXafE0bfUpkP7jag","algorithm":"AES-256-GCM","nonce":"SvpfJygZ3mDTVZaq","ciphertext":"PMIcguNyUiCUGDRTLd19mC7cg8S4YBS7Iw1S8U8s41GR4LGXnhOpZ35tI18g_W-k97fzkod8BaTe_tA","updatedAt":"2026-08-27T07:55:00Z"}
          EOF
